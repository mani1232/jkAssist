koog-features-opentelemetry = { module = "ai.koog:agents-features-opentelemetry", version.ref = "koog-beta" }

kotlin-io = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "io" }
kotlin-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlin-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

junit = { module = "junit:junit", version.ref = "junit" }

webpush = { module = "com.interaso:webpush", version.ref = "webpush" }

logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

compose-markdown = { module = "com.mikepenz:multiplatform-markdown-renderer", version.ref = "compose-markdown" }
