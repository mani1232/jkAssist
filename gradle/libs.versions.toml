koog-llm-bedrock = { module = "ai.koog:prompt-executor-bedrock-client", version.ref = "koog-beta" }
koog-llm-deepseek = { module = "ai.koog:prompt-executor-deepseek-client", version.ref = "koog-beta" }
koog-llm-mistral = { module = "ai.koog:prompt-executor-mistralai-client", version.ref = "koog-beta" }
koog-llm-openrouter = { module = "ai.koog:prompt-executor-openrouter-client", version.ref = "koog-beta" }
koog-llms-all = { module = "ai.koog:prompt-executor-llms-all", version.ref = "koog-beta" }

koog-ktor = { module = "ai.koog:koog-ktor", version.ref = "koog-beta" }

koog-features-memory = { module = "ai.koog:agents-features-memory", version.ref = "koog-beta" }
